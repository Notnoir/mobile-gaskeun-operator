name: gaskeun_operator_rw
description: "GasKeun — Portal Operator & Pengawas RW Biodigester Komunal"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Typography & Design
  google_fonts: ^6.2.1

  # Charts for IoT Sparklines and Participation
  fl_chart: ^0.70.2

  # Localization and Formatting
  intl: ^0.20.2

  # Unique Ticket & ID generation
  uuid: ^4.5.1

  # PDF Report Generation and Preview
  pdf: ^3.11.3
  printing: ^5.14.2

  # Route & URL Launcher (Deep link to Google Maps)
  url_launcher: ^6.3.1
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  firebase_database: ^11.3.0
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
